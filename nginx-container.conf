server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index landing_page.html;

    # Security headers for static files
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cache static assets aggressively
    location ~* \.(avif|svg|ico|woff2?|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cache PDFs for a week
    location ~* \.pdf$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # No cache for HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /landing_page.html;
    }

    # Proxy API requests to Node.js contact form server (host IP from container)
    location /api/ {
        proxy_pass http://172.17.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
