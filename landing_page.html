<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark-ink">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HZ Labs — סטודיו פיתוח · מערכות בקנה מידה אנושי</title>
  <meta name="description" content="HZ Labs — סטודיו פיתוח לבניית פלטפורמות תוכן, פורטלי לקוחות ומערכות מנויים. מהאפיון ועד הייצור, עם דגש על נגישות, ביצועים ויחס אנושי.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* === DESIGN TOKENS === */
    /* HZ Labs — Premium agency, cinematic, RTL Hebrew */

    :root {
      --accent: oklch(0.74 0.13 70);
      --accent-soft: color-mix(in oklch, var(--accent) 18%, transparent);

      --pad-section: 144px;
      --pad-x: clamp(20px, 4vw, 64px);
      --max: 1360px;

      --t-mono: "JetBrains Mono", ui-monospace, monospace;
      --t-sans: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;

      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    /* ---- DARK THEMES ---- */
    [data-theme="dark-ink"] {
      --bg: #0E0E0E; --bg-2: #161616; --bg-3: #1B1B1B;
      --line: #262626;
      --fg: #F4EFE7; --fg-2: #C8C2B5; --fg-3: #8C8679;
      --shadow-mix: #000;
    }
    [data-theme="dark-aubergine"] {
      --bg: #15101A; --bg-2: #1D1626; --bg-3: #241B30;
      --line: #2C2438;
      --fg: #F2EBE0; --fg-2: #C7BEB1; --fg-3: #897F73;
      --shadow-mix: #000;
    }
    [data-theme="dark-forest"] {
      --bg: #0F1512; --bg-2: #161E1A; --bg-3: #1C2622;
      --line: #232E29;
      --fg: #ECEDE3; --fg-2: #BFC3B4; --fg-3: #828776;
      --shadow-mix: #000;
    }
    [data-theme="dark-night"] {
      --bg: #0B0F14; --bg-2: #11161D; --bg-3: #161D27;
      --line: #1F2733;
      --fg: #E8EEF5; --fg-2: #B5BDC8; --fg-3: #7B8492;
      --shadow-mix: #000;
    }

    /* ---- LIGHT THEMES ---- */
    [data-theme="light-paper"] {
      --bg: #F4EFE7; --bg-2: #EBE5DA; --bg-3: #E2DBCC;
      --line: #D6CFBE;
      --fg: #1A1714; --fg-2: #4A4640; --fg-3: #7A7468;
      --shadow-mix: #877a5e;
    }
    [data-theme="light-bone"] {
      --bg: #FAFAF7; --bg-2: #F1F1EC; --bg-3: #E7E7E0;
      --line: #DCDCD3;
      --fg: #111111; --fg-2: #444; --fg-3: #777;
      --shadow-mix: #777;
    }
    [data-theme="light-sand"] {
      --bg: #EDE6D6; --bg-2: #E4DCC8; --bg-3: #DBD2BB;
      --line: #CCC2A8;
      --fg: #1F1A12; --fg-2: #4D4636; --fg-3: #807760;
      --shadow-mix: #6e5a32;
    }

    [data-density="compact"] { --pad-section: 96px; }
    [data-density="spacious"] { --pad-section: 192px; }

    /* === BASE RESET === */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      color: var(--fg);
      font-family: var(--t-sans);
      font-feature-settings: "kern", "ss01";
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.4s var(--ease), color 0.4s var(--ease);
      direction: rtl;
      font-size: 17px;
      line-height: 1.55;
      overflow-x: hidden;
    }
    html[data-theme], html[data-theme] body { background: var(--bg); }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    ul, ol { padding: 0; margin: 0; list-style: none; }
    .mono {
      font-family: var(--t-mono);
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--fg-3);
      font-weight: 500;
    }
    .container {
      max-width: var(--max);
      margin: 0 auto;
      padding-inline: var(--pad-x);
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }

    /* ============================================================
       HEADER
    ============================================================ */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in oklch, var(--bg) 86%, transparent);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
      gap: 32px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .brand-mark {
      width: 14px; height: 14px;
      border-radius: 2px;
      background: var(--accent);
      display: inline-block;
    }
    .brand-name {
      font-size: 16px;
      letter-spacing: 0.04em;
    }
    .site-nav {
      display: flex;
      align-items: center;
      gap: 36px;
    }
    .site-nav a {
      font-size: 15px;
      color: var(--fg-2);
      transition: color 0.2s var(--ease);
      position: relative;
    }
    .site-nav a:hover { color: var(--fg); }
    .site-nav a::after {
      content: "";
      position: absolute;
      inset-inline-start: 0;
      bottom: -6px;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width 0.3s var(--ease);
    }
    .site-nav a:hover::after { width: 100%; }
    .nav-portal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 14px;
      color: var(--fg);
      transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
    }
    .nav-portal:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .nav-portal::after { display: none; }
    .nav-portal-icon { font-family: var(--t-mono); font-size: 11px; }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px; height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--fg-2);
      transition: all 0.25s var(--ease);
    }
    .theme-toggle:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .theme-toggle::after { display: none !important; }

    .nav-toggle {
      display: none;
      width: 40px; height: 40px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
    .nav-toggle span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: var(--fg);
    }
  </style>
</head>
<body>
  <header class="site-header" id="top">
    <div class="container header-inner">
      <a href="#top" class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">HZ Labs</span>
      </a>
      <nav class="site-nav" id="siteNav" aria-label="ניווט ראשי">
        <a href="#case">פרויקט</a>
        <a href="#services">שירותים</a>
        <a href="#about">אודות</a>
        <a href="#contact">צור קשר</a>
        <a href="/customers.html" class="nav-portal">
          אזור לקוחות
          <span class="nav-portal-icon" aria-hidden="true">↗</span>
        </a>
        <button class="theme-toggle" id="themeToggle" aria-label="החלף ערכת נושא">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" id="themeIcon">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="פתח תפריט" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <main id="mainContent"></main>
  <footer class="site-footer" id="siteFooter"></footer>
  <script>
    // Theme
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const THEME_PAIR = { 'dark-ink': 'light-paper', 'light-paper': 'dark-ink' };
    const SUN_PATH = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
    const MOON_PATH = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

    function applyTheme(theme) {
      html.dataset.theme = theme;
      localStorage.setItem('hzlabs-theme', theme);
      const isDark = theme.startsWith('dark');
      themeIcon.innerHTML = isDark ? SUN_PATH : MOON_PATH;
      themeToggle.setAttribute('aria-label', isDark ? 'החלף למצב בהיר' : 'החלף למצב כהה');
    }

    applyTheme(localStorage.getItem('hzlabs-theme') || 'dark-ink');

    themeToggle.addEventListener('click', () => {
      applyTheme(THEME_PAIR[html.dataset.theme] || 'dark-ink');
    });

    // Mobile nav
    const navToggle = document.getElementById('navToggle');
    const siteNav = document.getElementById('siteNav');
    navToggle.addEventListener('click', () => {
      const open = siteNav.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', String(open));
    });
    siteNav.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        siteNav.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
</body>
</html>
