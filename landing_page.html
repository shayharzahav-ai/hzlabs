<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark-ink">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HZ Labs — סטודיו פיתוח · מערכות בקנה מידה אנושי</title>
  <meta name="description" content="HZ Labs — סטודיו פיתוח לבניית פלטפורמות תוכן, פורטלי לקוחות ומערכות מנויים. מהאפיון ועד הייצור, עם דגש על נגישות, ביצועים ויחס אנושי.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* === DESIGN TOKENS === */
    /* HZ Labs — Premium agency, cinematic, RTL Hebrew */

    :root {
      --accent: oklch(0.74 0.13 70);
      --accent-soft: color-mix(in oklch, var(--accent) 18%, transparent);

      --pad-section: 144px;
      --pad-x: clamp(20px, 4vw, 64px);
      --max: 1360px;

      --t-mono: "JetBrains Mono", ui-monospace, monospace;
      --t-sans: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;

      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    /* ---- DARK THEMES ---- */
    [data-theme="dark-ink"] {
      --bg: #0E0E0E; --bg-2: #161616; --bg-3: #1B1B1B;
      --line: #262626;
      --fg: #F4EFE7; --fg-2: #C8C2B5; --fg-3: #8C8679;
      --shadow-mix: #000;
    }
    [data-theme="dark-aubergine"] {
      --bg: #15101A; --bg-2: #1D1626; --bg-3: #241B30;
      --line: #2C2438;
      --fg: #F2EBE0; --fg-2: #C7BEB1; --fg-3: #897F73;
      --shadow-mix: #000;
    }
    [data-theme="dark-forest"] {
      --bg: #0F1512; --bg-2: #161E1A; --bg-3: #1C2622;
      --line: #232E29;
      --fg: #ECEDE3; --fg-2: #BFC3B4; --fg-3: #828776;
      --shadow-mix: #000;
    }
    [data-theme="dark-night"] {
      --bg: #0B0F14; --bg-2: #11161D; --bg-3: #161D27;
      --line: #1F2733;
      --fg: #E8EEF5; --fg-2: #B5BDC8; --fg-3: #7B8492;
      --shadow-mix: #000;
    }

    /* ---- LIGHT THEMES ---- */
    [data-theme="light-paper"] {
      --bg: #F4EFE7; --bg-2: #EBE5DA; --bg-3: #E2DBCC;
      --line: #D6CFBE;
      --fg: #1A1714; --fg-2: #4A4640; --fg-3: #7A7468;
      --shadow-mix: #877a5e;
    }
    [data-theme="light-bone"] {
      --bg: #FAFAF7; --bg-2: #F1F1EC; --bg-3: #E7E7E0;
      --line: #DCDCD3;
      --fg: #111111; --fg-2: #444; --fg-3: #777;
      --shadow-mix: #777;
    }
    [data-theme="light-sand"] {
      --bg: #EDE6D6; --bg-2: #E4DCC8; --bg-3: #DBD2BB;
      --line: #CCC2A8;
      --fg: #1F1A12; --fg-2: #4D4636; --fg-3: #807760;
      --shadow-mix: #6e5a32;
    }

    [data-density="compact"] { --pad-section: 96px; }
    [data-density="spacious"] { --pad-section: 192px; }

    /* === BASE RESET === */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      color: var(--fg);
      font-family: var(--t-sans);
      font-feature-settings: "kern", "ss01";
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.4s var(--ease), color 0.4s var(--ease);
      direction: rtl;
      font-size: 17px;
      line-height: 1.55;
      overflow-x: hidden;
    }
    html[data-theme], html[data-theme] body { background: var(--bg); }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    ul, ol { padding: 0; margin: 0; list-style: none; }
    .mono {
      font-family: var(--t-mono);
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--fg-3);
      font-weight: 500;
    }
    .container {
      max-width: var(--max);
      margin: 0 auto;
      padding-inline: var(--pad-x);
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
  </style>
</head>
<body>
  <p style="color:white;padding:20px">shell</p>
  <script>/* JS HERE */</script>
</body>
</html>
